on:
  workflow_call:

concurrency:
  group: ${{ github.ref }}-pr-semantic
  cancel-in-progress: true

jobs:
  pr_title:
    name: Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$ # don't start with an uppercase character.
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          types: |
            fix
            feat
            revert
            docs
            style
            refactor
            test
            deps
            chore
          ignoreLabels: |
            bot

      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        name: Check forbidden labels
        with:
          mode: exactly
          count: 0
          labels: |
            do-not-merge
            WIP
            do not merge

      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        name: Check required label
        with:
          mode: exactly
          count: 1
          labels: |
            major
            minor
            patch
