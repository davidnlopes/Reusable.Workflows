on:
  workflow_call:
    inputs:
      runsOn:
        required: false
        type: string
        default: ubuntu-latest
        description: runner label for the job, for example the name of a self-hosted runner scale set
      terraformProjectDir:
        required: false
        type: string
        default: .
        description: path of the Terraform project, relative to the root of the repository
      runPlanOrApply:
        required: false
        type: boolean
        default: true
        description: whether or not to run Terraform plan/apply/destroy
      awsRoleArn:
        required: false
        description: the IAM role ARN to be assumed when running OpenTofu/Terraform operations
        type: string
        default: ""
      terraformWorkspace:
        required: false
        default: ""
        description: the name of the OpenTofu/Terraform workspace
        type: string
      terraformAction:
        required: false
        default: plan
        description: the type of action to execute in OpenTofu/Terraform (plan/apply/destroy)
        type: string
      terraformVarsFile: # TODO: support empty vars file
        required: true
        description: the location of the tfvars file, related to the 'terraformProjectDir'
        type: string
      addPullRequestComments:
        required: false
        type: boolean
        default: true
      terraformVersion:
        description: Terraform version to install
        type: string
        required: false
        default: "1.9.2"
      openTofuVersion:
        type: string
        description: OpenTofu version to install
        required: false
        default: "1.7.3"
      binary:
        type: string
        description: the binary to use for the OpenTofu/Terraform operations (OpenTofu/Terraform)
        required: false
        default: terraform
      ignoreErrors:
        required: false
        type: boolean
        default: false
        description: whether or not to ignore errors

jobs:
  terraform:
    name: ${{ inputs.terraformAction }}
    runs-on: ${{ inputs.runsOn }}
    permissions:
      pull-requests: write
      contents: read
      id-token: write # needed for OIDC login in AWS
      statuses: write # needed for setting the status of the PR
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.terraformProjectDir }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_CLI_ARGS: -no-color
      TF_CLI_ARGS_plan: -lock=false -var-file=${{ inputs.terraformVarsFile }}
      TF_CLI_ARGS_apply: -var-file=${{ inputs.terraformVarsFile }} -auto-approve
      TOFU_WORKSPACE: ${{ inputs.terraformWorkspace }}
      TF_WORKSPACE: ${{ inputs.terraformWorkspace }}
      CHECK_NAME: Terraform CI

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set pending status
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=pending" -f "description=validations running" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Checkout reusable-workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: davidnlopes/reusable-workflows
          path: actions

      # The Terraform wrapper is a Node script; self-hosted runners ship without Node
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Install tools
        uses: ./actions/.github/actions/install-common-tools
        with:
          terraformVersion: ${{ inputs.terraformVersion }}
          openTofuVersion: ${{ inputs.openTofuVersion }}

      - name: Format
        id: fmt
        run: ${{ inputs.binary }} fmt -recursive -diff -check 2>&1 | tee "${RUNNER_TEMP}/terraform-fmt.out"

      - name: Configure AWS Credentials
        if: ${{ inputs.runPlanOrApply }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.awsRoleArn }}
          aws-region: eu-west-1
          role-session-name: ${{ inputs.terraformWorkspace }}

      - name: Init
        id: init
        run: |
          if [ ${{ inputs.runPlanOrApply }} == true ]; then
            ${{ inputs.binary }} init -upgrade 2>&1 | tee "${RUNNER_TEMP}/terraform-init.out"
          else
            ${{ inputs.binary }} init -backend=false 2>&1 | tee "${RUNNER_TEMP}/terraform-init.out"
          fi

      - name: Validate
        id: validate
        run: ${{ inputs.binary }} validate 2>&1 | tee "${RUNNER_TEMP}/terraform-validate.out"

      - name: .terraform.lock.hcl updated?
        id: verify_lockfile
        run: git --no-pager diff --exit-code .terraform.lock.hcl
        continue-on-error: true

      - name: ${{ inputs.terraformAction }}
        if: ${{ inputs.runPlanOrApply }}
        id: plan_or_apply
        run: ${{ inputs.binary }} ${{ inputs.terraformAction }} 2>&1 | tee "${RUNNER_TEMP}/terraform-plan.out"

      - name: Comment PR (outdated lockfile)
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && inputs.addPullRequestComments && steps.verify_lockfile.outcome == 'failure'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: recreate
          comment-tag: lockfile-up-to-date
          create-if-not-exists: true
          message: |
            > [!CAUTION]
            > terraform.lockfile.hcl is not up to date!

      - name: Comment PR (fmt, init, validate, ${{ inputs.terraformAction }})
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && inputs.addPullRequestComments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT_DIR: ${{ runner.temp }}
          PROJECT_DIR: ${{ inputs.terraformProjectDir }}
          WORKSPACE: ${{ inputs.terraformWorkspace }}
          BINARY: ${{ inputs.binary }}
          ACTION: ${{ inputs.terraformAction }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan_or_apply.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const env = process.env;
            const workspace = env.WORKSPACE || 'default';
            const tool = env.BINARY === 'tofu' ? 'OpenTofu' : 'Terraform';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // GitHub rejects comment bodies longer than 65536 characters.
            const maxChunk = 60000;
            const maxParts = 5;
            const planStart = [
              'Terraform used the selected providers to generate the following execution',
              'OpenTofu used the selected providers to generate the following execution',
              'No changes. Your infrastructure matches the configuration.',
              'Planning failed.',
              'Terraform planned the following actions, but then encountered a problem:',
              'OpenTofu planned the following actions, but then encountered a problem:',
            ];

            const stages = [
              { key: 'fmt', label: 'fmt', outcome: env.FMT_OUTCOME, alwaysPost: false },
              { key: 'init', label: 'init', outcome: env.INIT_OUTCOME, alwaysPost: false },
              { key: 'validate', label: 'validate', outcome: env.VALIDATE_OUTCOME, alwaysPost: false },
              { key: 'plan', label: env.ACTION, outcome: env.PLAN_OUTCOME, alwaysPost: true },
            ];

            const marker = (key) => `<!-- terraform-ci:${key}:${env.PROJECT_DIR}:${workspace} -->`;
            const escapeRegExp = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // Comments posted by GetTerminus/terraform-pr-commenter before this workflow stopped using it.
            const legacyPatterns = {
              fmt: [/^### Terraform `fmt` Failed/],
              init: [/^### Terraform `init` Failed/],
              validate: [/^### Terraform `validate` Failed/],
              plan: [
                new RegExp('^### Terraform `plan` .* for Workspace: `' + escapeRegExp(workspace) + '`'),
                new RegExp('^### Changes to outputs for Workspace: `' + escapeRegExp(workspace) + '`'),
              ],
            };

            // The setup-terraform and setup-opentofu wrappers print [command] and workflow-command lines to stdout.
            function readOutput(key) {
              let text;
              try {
                text = fs.readFileSync(path.join(env.OUTPUT_DIR, `terraform-${key}.out`), 'utf8');
              } catch {
                return '';
              }
              return text
                .replace(/\x1b\[[0-9;]*m/g, '')
                .split('\n')
                .filter((line) => !/^(\[command\]|::[a-z-]+( [^:]*)?::)/.test(line))
                .join('\n')
                .trim();
            }

            function trimPlan(text) {
              const lines = text.split('\n');
              const start = lines.findIndex((line) => planStart.some((s) => line.startsWith(s)));
              return start > 0 ? lines.slice(start).join('\n') : text;
            }

            // Moves the change symbol to column 0 so GitHub's diff highlighting colours it.
            function highlight(text) {
              return text
                .split('\n')
                .map((line) => {
                  const m = line.match(/^(\s*)(-\/\+|\+\/-|[-+~])(\s.*)?$/);
                  if (!m) return line;
                  const sign = m[2] === '+' || m[2] === '-' ? m[2] : '!';
                  return sign + m[1] + (m[3] || '');
                })
                .join('\n');
            }

            function summary(text) {
              const line = text
                .split('\n')
                .find((l) => /^(Plan: |No changes\.|Apply complete!|Destroy complete!|Error: )/.test(l));
              return line ? `\`${line.trim()}\`` : null;
            }

            function split(text) {
              const parts = [];
              let rest = text;
              while (rest.length > maxChunk && parts.length < maxParts - 1) {
                let cut = rest.lastIndexOf('\n', maxChunk);
                if (cut <= 0) cut = maxChunk;
                parts.push(rest.slice(0, cut));
                rest = rest.slice(cut).replace(/^\n/, '');
              }
              if (rest.length > maxChunk) {
                rest = rest.slice(0, maxChunk) + `\n\n... output truncated, see the full log in the workflow run.`;
              }
              parts.push(rest);
              return parts;
            }

            function fence(text) {
              const longest = Math.max(2, ...(text.match(/`+/g) || []).map((m) => m.length));
              return '`'.repeat(longest + 1);
            }

            async function listComments() {
              return github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
            }

            const comments = await listComments();

            for (const stage of stages) {
              if (stage.outcome !== 'success' && stage.outcome !== 'failure') continue;

              const stale = comments.filter(
                (c) =>
                  c.body &&
                  (c.body.includes(marker(stage.key)) ||
                    (c.user?.login === 'github-actions[bot]' && legacyPatterns[stage.key].some((re) => re.test(c.body)))),
              );
              for (const c of stale) {
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
              }

              const failed = stage.outcome === 'failure';
              if (!failed && !stage.alwaysPost) continue;

              let output = readOutput(stage.key) || 'No output was captured.';
              if (stage.key === 'plan') output = highlight(trimPlan(output));

              const status = failed ? 'Failed' : 'Succeeded';
              const where = env.PROJECT_DIR && env.PROJECT_DIR !== '.' ? ` in \`${env.PROJECT_DIR}\`` : '';
              const parts = split(output);
              for (const [i, part] of parts.entries()) {
                const count = parts.length > 1 ? ` (${i + 1}/${parts.length})` : '';
                const f = fence(part);
                const body = [
                  marker(stage.key),
                  `### ${tool} \`${stage.label}\` ${status} for Workspace: \`${workspace}\`${where}${count}`,
                  i === 0 && stage.key === 'plan' ? summary(output) : null,
                  '<details><summary>Show Output</summary>',
                  '',
                  `${f}${stage.key === 'init' ? '' : 'diff'}`,
                  part,
                  f,
                  '</details>',
                  '',
                  `[Workflow run](${runUrl})`,
                ]
                  .filter((line) => line !== null)
                  .join('\n');
                await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
              }
            }

      - name: Set status success
        if: ${{ (success() || inputs.IgnoreErrors == true) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=success" -f "description=validations successful" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Set status failure
        if: ${{ (failure() && inputs.IgnoreErrors == false) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=failure" -f "description=validations failed" \
            -f "context=${{ env.CHECK_NAME }}"
