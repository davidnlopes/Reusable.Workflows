name: PR title
on:
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize]

concurrency:
  group: required-pr-title-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  pr_labels:
    name: Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the shared labeler config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: davidnlopes/Reusable.Workflows
          ref: v1
          path: shared
          sparse-checkout: .github/labeler-config.yaml

      - uses: srvaroa/labeler@v1.14.0
        with:
          config_path: shared/.github/labeler-config.yaml
          use_local_config: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  semantic_pr:
    needs: pr_labels
    name: Semantic
    uses: davidnlopes/Reusable.Workflows/.github/workflows/semantic-pr.yaml@v1
