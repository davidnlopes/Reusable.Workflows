on:
  workflow_call:
    inputs:
      runsOn:
        required: false
        type: string
        default: ubuntu-latest
        description: runner label for the job; the runner needs Docker with the Buildx plugin
      projectDir:
        required: false
        type: string
        default: "."
        description: directory Bake runs from, relative to the root of the repository; bakeFiles and the relative paths inside them resolve from here
      bakeFiles:
        required: false
        type: string
        default: docker-bake.hcl
        description: Bake definition files, comma- or newline-separated, relative to projectDir
      targets:
        required: false
        type: string
        default: default
        description: Bake targets or groups to build, comma- or newline-separated
      push:
        required: false
        type: boolean
        default: false
        description: push the built images to the registry
      set:
        required: false
        type: string
        default: ""
        description: Bake overrides, one targetpattern.key=value per line, passed as --set
      version:
        required: false
        type: string
        default: ""
        description: value of the VERSION environment variable that the Bake file can read through a VERSION variable; left unset when empty
      registry:
        required: false
        type: string
        default: ""
        description: registry host to log in to, for example ghcr.io or 123456789012.dkr.ecr.us-east-1.amazonaws.com; no login when empty
      registryUsername:
        required: false
        type: string
        default: ""
        description: username for the registry login with the REGISTRY_PASSWORD secret; defaults to the workflow actor on ghcr.io
      awsRoleArn:
        required: false
        type: string
        default: ""
        description: IAM role to assume with GitHub OIDC before logging in to an Amazon ECR registry
      awsRegion:
        required: false
        type: string
        default: ""
        description: AWS region for awsRoleArn; read from the ECR registry host when empty
      setupQemu:
        required: false
        type: string
        default: auto
        description: "install QEMU emulators: auto installs them when a target platform differs from the runner architecture, true always, false never"
      ignoreErrors:
        required: false
        type: boolean
        default: false
        description: whether or not to ignore errors
    secrets:
      REGISTRY_PASSWORD:
        required: false
        description: password or token for the registry login; ghcr.io falls back to GITHUB_TOKEN

env:
  CHECK_NAME: Docker CI

jobs:
  docker:
    name: Docker Bake
    runs-on: ${{ inputs.runsOn }}
    permissions:
      contents: read # checkout repository
      statuses: write # set the commit status on pull requests
      packages: write # push images to ghcr.io with GITHUB_TOKEN
      id-token: write # assume awsRoleArn with GitHub OIDC
    defaults:
      run:
        working-directory: ${{ inputs.projectDir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set status pending
        if: github.event_name == 'pull_request' || github.event_name ==
          'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=pending" -f "description=Docker build is running" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Resolve build settings
        id: settings
        env:
          BAKE_FILES: ${{ inputs.bakeFiles }}
          BAKE_TARGETS: ${{ inputs.targets }}
          BAKE_SET: ${{ inputs.set }}
          INPUT_VERSION: ${{ inputs.version }}
          SETUP_QEMU: ${{ inputs.setupQemu }}
          REGISTRY: ${{ inputs.registry }}
          AWS_ROLE_ARN: ${{ inputs.awsRoleArn }}
          AWS_REGION_INPUT: ${{ inputs.awsRegion }}
        run: |
          set -euo pipefail

          # Bake lets an empty VERSION override the variable's default, so export it only when set.
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
            export VERSION="$INPUT_VERSION"
          fi

          if [ -n "$AWS_ROLE_ARN" ]; then
            region="$AWS_REGION_INPUT"
            if [ -z "$region" ]; then
              if [[ "$REGISTRY" =~ \.dkr\.ecr(-fips)?\.([a-z0-9-]+)\.amazonaws\.com ]]; then
                region="${BASH_REMATCH[2]}"
              elif [ "$REGISTRY" = "public.ecr.aws" ]; then
                region="us-east-1"
              else
                echo "::error::awsRegion is empty and cannot be read from registry '$REGISTRY'"
                exit 1
              fi
            fi
            echo "aws-region=$region" >> "$GITHUB_OUTPUT"
          fi

          case "$SETUP_QEMU" in
            true | false) qemu="$SETUP_QEMU" ;;
            auto)
              args=()
              while IFS= read -r f; do
                [ -n "$f" ] && args+=(--file "$f")
              done < <(tr ',' '\n' <<< "$BAKE_FILES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              while IFS= read -r s; do
                [ -n "$s" ] && args+=(--set "$s")
              done < <(sed 's/^[[:space:]]*//;s/[[:space:]]*$//' <<< "$BAKE_SET")
              while IFS= read -r t; do
                [ -n "$t" ] && args+=("$t")
              done < <(tr ',' '\n' <<< "$BAKE_TARGETS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

              case "$(uname -m)" in
                x86_64 | amd64) native="linux/amd64 linux/386" ;;
                aarch64 | arm64) native="linux/arm64" ;;
                *) native="linux/$(uname -m)" ;;
              esac

              qemu=false
              definition="$(docker buildx bake --print "${args[@]}")"
              if command -v jq > /dev/null; then
                platforms="$(jq -r '.target[].platforms[]?' <<< "$definition" | sort -u)"
              else
                platforms="$(grep -oE '"(linux|windows|darwin|freebsd)/[a-z0-9_]+(/[a-z0-9]+)?"' <<< "$definition" | tr -d '"' | sort -u || true)"
              fi
              for p in $platforms; do
                base="$(cut -d/ -f1-2 <<< "$p")"
                if [[ " $native " != *" $base "* ]]; then
                  echo "Platform $p needs emulation on this $(uname -m) runner"
                  qemu=true
                fi
              done
              ;;
            *)
              echo "::error::setupQemu must be auto, true or false, got '$SETUP_QEMU'"
              exit 1
              ;;
          esac
          echo "setup-qemu=$qemu" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.settings.outputs.setup-qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure AWS credentials
        if: inputs.awsRoleArn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.awsRoleArn }}
          aws-region: ${{ steps.settings.outputs.aws-region }}
          role-session-name: docker-bake

      # On an ECR host, the login action takes AWS credentials from the environment when
      # username and password are empty.
      - name: Log in to the registry
        if: inputs.registry != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.awsRoleArn == '' && (inputs.registryUsername != '' && inputs.registryUsername || (inputs.registry == 'ghcr.io' && github.actor || '')) || '' }}
          password: ${{ inputs.awsRoleArn == '' && (secrets.REGISTRY_PASSWORD != '' && secrets.REGISTRY_PASSWORD || (inputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || '')) || '' }}

      - name: Bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: ./${{ inputs.projectDir }}
          files: ${{ inputs.bakeFiles }}
          targets: ${{ inputs.targets }}
          set: ${{ inputs.set }}
          push: ${{ inputs.push }}

      - name: Set status success
        if: ${{ (success() || inputs.ignoreErrors == true) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=success" -f "description=Docker build was successful" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Set status failure
        if: ${{ (failure() && inputs.ignoreErrors == false) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=failure" -f "description=Docker build failed" \
            -f "context=${{ env.CHECK_NAME }}"
