name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # The v* tag ruleset only lets the release app bypass it, and git push uses the credentials checkout persists.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Semantic Release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Update major/minor tags
        if: steps.semantic_release.outputs.new_release_published == 'true'
        run: |
          git tag -f "v${{ steps.semantic_release.outputs.new_release_major_version }}"
          git tag -f "v${{ steps.semantic_release.outputs.new_release_major_version }}.${{ steps.semantic_release.outputs.new_release_minor_version }}"
          git push origin -f "v${{ steps.semantic_release.outputs.new_release_major_version }}"
          git push origin -f "v${{ steps.semantic_release.outputs.new_release_major_version }}.${{ steps.semantic_release.outputs.new_release_minor_version }}"
