on:
  workflow_call:
    inputs:
      goVersion:
        required: false
        type: string
        default: ""
        description: Go version to install. If empty, the version comes from goVersionFile.
      goVersionFile:
        required: false
        type: string
        default: ""
        description: file that sets the Go version, relative to the root of the repository. Default is go.mod in golangProjectDir
      buildCommand:
        required: true
        type: string
        description: a CLI command to build the project
      testCommand:
        required: true
        type: string
        description: a CLI command to unit-test the project
      golangProjectDir:
        required: false
        type: string
        default: .
        description: path of the Golang project, relative to the root of the repository
      ignoreErrors:
        required: false
        type: boolean
        default: false
        description: whether or not to ignore errors
      submodules:
        required: false
        type: boolean
        default: true
        description: whether or not to check out the repository's Git submodules
    secrets:
      CODECOV_TOKEN:
        required: false
env:
  CHECK_NAME: Golang CI

jobs:
  golang:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required: allow read access to the content for analysis.
      pull-requests: read # Optional: allow read access to pull request. Use with `only-new-issues` option.
      checks: write # Optional: allow write access to checks to allow the action to annotate code in the PR.
      statuses: write # needed for setting the status of the PR
    defaults:
      run:
        working-directory: ${{ inputs.golangProjectDir }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: ${{ inputs.submodules }}

      - name: Set status pending
        if: github.event_name == 'pull_request' || github.event_name ==
          'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=pending" -f "description=Golang checks are running" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Checkout reusable-workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dnlopes/Reusable.Workflows
          path: actions

      - name: Install tools
        uses: ./actions/.github/actions/install-common-tools
        with:
          goVersion: ${{ inputs.goVersion }}
          goVersionFile: ${{ inputs.goVersion == '' && (inputs.goVersionFile != '' && inputs.goVersionFile || format('{0}/go.mod', inputs.golangProjectDir)) || '' }}

      - name: Build
        run: ${{ inputs.buildCommand }}

      - name: Test
        run: ${{ inputs.testCommand }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ env.CODECOV_TOKEN != '' }}
        name: Upload coverage to Codecov
        with:
          fail_ci_if_error: false
          verbose: true
          directory: ${{ inputs.golangProjectDir }}
        env:
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

      - name: Set status success
        if: ${{ (success() || inputs.IgnoreErrors == true) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=success" -f "description=Golang checks were successful" \
            -f "context=${{ env.CHECK_NAME }}"

      - name: Set status failure
        if: ${{ (failure() && inputs.IgnoreErrors == false) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f "state=failure" -f "description=Golang checks failed validations!" \
            -f "context=${{ env.CHECK_NAME }}"
