name: Trivy
on:
  pull_request:

concurrency:
  group: required-trivy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    name: Security
    uses: davidnlopes/Reusable.Workflows/.github/workflows/trivy-scan.yaml@v1
    with:
      runsOn: ${{ (github.event.repository.private && github.event.pull_request.user.login != 'davidnlopes-uplift[bot]') && 'homelab-prod' || 'ubuntu-latest' }}
