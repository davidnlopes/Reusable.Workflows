name: Trivy
on:
  pull_request:

concurrency:
  group: required-trivy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  security:
    name: Security
    uses: davidnlopes/Reusable.Workflows/.github/workflows/trivy-scan.yaml@v1
