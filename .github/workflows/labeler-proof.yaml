name: Labeler proof
on:
  pull_request:

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/labeler.yaml

  show:
    needs: labeler
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          echo "LABELS: $(gh pr view $PR --json labels -q '[.labels[].name]|sort|join(",")')"
