on:
  workflow_call:
    inputs:
      runsOn:
        required: false
        type: string
        default: ubuntu-latest
        description: runner label for the job, for example the name of a self-hosted runner scale set; the runner must be able to run Docker container actions unless useDocker is false
      useDocker:
        required: false
        type: boolean
        default: true
        description: run srvaroa/labeler as its Docker container action; set to false on runners without a Docker daemon to run the release binary directly

jobs:
  labels:
    name: Labels
    runs-on: ${{ inputs.runsOn }}
    permissions:
      contents: read # checkout the shared labeler config
      pull-requests: write # add and remove labels on the PR
    env:
      # renovate: datasource=github-release-attachments depName=srvaroa/labeler
      LABELER_VERSION: v1.14.0
      LABELER_SHA256: da0243ee2c0cae39ce2bd7c729f6ce237f8944e91fdc7b48e41371abaeb89472
    steps:
      - name: Checkout the shared labeler config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: davidnlopes/Reusable.Workflows
          ref: v1
          path: shared
          sparse-checkout: .github/labeler-config.yaml

      - if: ${{ inputs.useDocker }}
        uses: srvaroa/labeler@bf262763a8a8e191f5847873aecc0f29df84f957 # v1.14.0
        with:
          config_path: shared/.github/labeler-config.yaml
          use_local_config: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run srvaroa/labeler binary
        if: ${{ !inputs.useDocker }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CONFIG_PATH: shared/.github/labeler-config.yaml
          INPUT_USE_LOCAL_CONFIG: "true"
          INPUT_FAIL_ON_ERROR: "false"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/action.tar.gz" \
            "https://github.com/srvaroa/labeler/releases/download/${LABELER_VERSION}/action.tar.gz"
          echo "${LABELER_SHA256}  $tmp/action.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/action.tar.gz" -C "$tmp" action
          "$tmp/action"
